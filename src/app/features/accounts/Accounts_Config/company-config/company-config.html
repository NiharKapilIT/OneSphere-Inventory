<div class="tabs-section">
    <div class="tabs-nav">

        <button class="tab-item" [class.active]="selectedTab === 'companyConfiguration'" (click)="companyConfiguration();
           selectedTab = 'companyConfiguration'">
            <span class="tab-label">Company Configuration</span>
            <!-- <span class="erp-badge badge-warning">{{ companyConfiguration?? 0 }}</span> -->
        </button>

        <button class="tab-item" [class.active]="selectedTab === 'branchConfiguration'"
            (click)="branchConfiguration(); selectedTab = 'branchConfiguration'">
            <span class="tab-label">Branch Configuration</span>
            <!-- <span class="erp-badge badge-secondary">{{ branchConfiguration ?? 0 }}</span> -->
        </button>

        <button class="tab-item" [class.active]="selectedTab === 'userInfo'"
            (click)="userInfo(); selectedTab = 'userInfo'">
            <span class="tab-label">User Info</span>
            <!-- <span class="erp-badge badge-primary">{{ userInfo ?? 0 }}</span> -->
        </button>



    </div>
</div>



<div class="tbl-wrap">
    <p-table #dt [value]="gridData || []" [paginator]="true" [rows]="pageSize" [rowsPerPageOptions]="[10, 20, 50]"
        [scrollable]="true" scrollHeight="500px" responsiveLayout="scroll" [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        styleClass="gr-table p-datatable-sm p-datatable-gridlines">

        <!-- Header -->
        <ng-template pTemplate="header">
            <tr>

                @if(companyshowgrid()){
                <th>
                    <div class="th-cell">Company Name</div>
                </th>
                <th>
                    <div class="th-cell">Company code</div>
                </th>
                <th>
                    <div class="th-cell">CIN Number</div>
                </th>
                <th>
                    <div class="th-cell">PAN Number</div>
                </th>
                <th>
                    <div class="th-cell">Regristration addres</div>
                </th>

                }
                @if(branchshowgrid()){
                <th>
                    <div class="th-cell">Branch Name</div>
                </th>
                <th>
                    <div class="th-cell">Branch code</div>
                </th>
                <th>
                    <div class="th-cell">GST Number</div>
                </th>
                <th>
                    <div class="th-cell">State Code</div>
                </th>
                <th>
                    <div class="th-cell">Branch Email</div>
                </th>
                <th>
                    <div class="th-cell">Branch Contact Number</div>
                </th>
                <th>
                    <div class="th-cell">Status</div>
                </th>
                }


            </tr>
        </ng-template>


        <!-- Empty Message -->
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="13" class="p-4">
                    <div class="empty-state">
                        <i class="pi pi-inbox empty-state__icon"></i>
                        <p class="empty-state__text">No cheques found</p>
                    </div>
                </td>
            </tr>
        </ng-template>




    </p-table>
</div>
