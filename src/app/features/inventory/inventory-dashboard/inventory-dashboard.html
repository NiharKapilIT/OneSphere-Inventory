<div class="module-page">
  <div class="erp-card">
    <div class="card-header">
      <div>
        <h4 class="card-title">
          <i class="pi pi-box"></i>
          Inventory Dashboard
        </h4>
        <p class="card-subtitle">Deposit, withdrawal, and transfer overview</p>
      </div>
    </div>

    <div class="card-body p-0">
      <div class="p-4">
        <div class="row g-3">
          @for (stat of stats; track stat.label) {
            <div class="col-xl-3 col-lg-4 col-md-6">
              <div class="erp-grid-shell p-3 h-100 d-flex align-items-center justify-content-between">
                <div>
                  <span class="text-muted text-small d-block">{{ stat.label }}</span>
                  <strong class="fs-5">{{ stat.value }}</strong>
                </div>
                <i [class]="stat.icon"></i>
              </div>
            </div>
          }
        </div>

      </div>
    </div>
  </div>
</div>
