<div class="role-pan-section">
  <div class="role-pan-row">
    <span class="role-pan-label">PAN</span>
    @if (contact?.panNo) {
      <span class="role-pan-available"><i class="pi pi-check-circle"></i> Available</span>
    } @else {
      <span class="role-pan-unavailable"><i class="pi pi-times-circle"></i> Not Available</span>
    }
  </div>
  <div class="role-pan-number">{{ maskPan(contact?.panNo) }}</div>
</div>
<div class="role-form-grid mt-3">
  <div class="erp-form-group">
    <label>Introduced By</label>
    <ng-select appendTo="body" [items]="[]" placeholder="Search Employee / Staff" [searchable]="true" [clearable]="true"></ng-select>
  </div>
  <div class="erp-form-group">
    <label>TDS Section No.<span class="required">*</span></label>
    <ng-select appendTo="body" [items]="tdsOptions" placeholder="Select TDS Section" [searchable]="true" [clearable]="false"></ng-select>
  </div>
  <div class="erp-form-group">
    <label>Designation</label>
    <ng-select appendTo="body" [items]="[]" placeholder="Select Designation" [searchable]="true" [clearable]="true"></ng-select>
  </div>
</div>
