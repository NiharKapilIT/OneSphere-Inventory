@if (active()) {

  <!-- ── Dark overlay with spotlight cutout ────────────────────────────── -->
  <svg
    class="tour-overlay"
    [attr.viewBox]="svgVB"
    preserveAspectRatio="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true">

    <defs>
      <mask [attr.id]="maskId">
        <!-- White = show overlay; Black = cut out (transparent hole) -->
        <rect x="0" y="0" [attr.width]="vpW" [attr.height]="vpH" fill="white"/>
        <rect
          [attr.x]="spot.x" [attr.y]="spot.y"
          [attr.width]="spot.w" [attr.height]="spot.h"
          rx="10" fill="black"/>
      </mask>
    </defs>

    <!-- Dark overlay with hole -->
    <rect
      x="0" y="0"
      [attr.width]="vpW" [attr.height]="vpH"
      fill="#060f1e"
      fill-opacity="0.76"
      [attr.mask]="'url(#' + maskId + ')'"/>

    <!-- Spotlight ring (animated pulse via CSS class) -->
    <rect
      class="tour-spot-ring"
      [attr.x]="spot.x" [attr.y]="spot.y"
      [attr.width]="spot.w" [attr.height]="spot.h"
      rx="10"
      fill="none"
      stroke="#4d8fff"
      stroke-width="2.5"/>

    <!-- Corner tick marks on spotlight -->
    <g class="tour-spot-ticks" stroke="#4d8fff" stroke-width="1.5" fill="none">
      <!-- Top-left -->
      <line [attr.x1]="spot.x"            [attr.y1]="spot.y + 14"    [attr.x2]="spot.x"            [attr.y2]="spot.y"/>
      <line [attr.x1]="spot.x"            [attr.y1]="spot.y"          [attr.x2]="spot.x + 14"        [attr.y2]="spot.y"/>
      <!-- Top-right -->
      <line [attr.x1]="spot.x + spot.w - 14" [attr.y1]="spot.y"       [attr.x2]="spot.x + spot.w"    [attr.y2]="spot.y"/>
      <line [attr.x1]="spot.x + spot.w"   [attr.y1]="spot.y"          [attr.x2]="spot.x + spot.w"    [attr.y2]="spot.y + 14"/>
      <!-- Bottom-left -->
      <line [attr.x1]="spot.x"            [attr.y1]="spot.y + spot.h - 14" [attr.x2]="spot.x"        [attr.y2]="spot.y + spot.h"/>
      <line [attr.x1]="spot.x"            [attr.y1]="spot.y + spot.h" [attr.x2]="spot.x + 14"        [attr.y2]="spot.y + spot.h"/>
      <!-- Bottom-right -->
      <line [attr.x1]="spot.x + spot.w - 14" [attr.y1]="spot.y + spot.h" [attr.x2]="spot.x + spot.w" [attr.y2]="spot.y + spot.h"/>
      <line [attr.x1]="spot.x + spot.w"   [attr.y1]="spot.y + spot.h - 14" [attr.x2]="spot.x + spot.w" [attr.y2]="spot.y + spot.h"/>
    </g>

  </svg>

  <!-- ── Tooltip card ───────────────────────────────────────────────────── -->
  <div
    class="tour-card"
    role="dialog"
    aria-live="polite"
    [style.top.px]="ttTop"
    [style.left.px]="ttLeft"
    (mouseenter)="pausePlay()"
    (mouseleave)="resumePlay()">

    <!-- Header: icon + step badge + close -->
    <div class="tc-header">
      <div class="tc-icon-wrap">
        <i class="pi" [class]="currentStep().icon"></i>
      </div>
      <div class="tc-badge">
        Step {{ stepIndex() + 1 }} <span class="tc-badge-of">of {{ steps.length }}</span>
      </div>
      <button class="tc-close" (click)="skip()" title="Close tour (Esc)" aria-label="Close tour">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <!-- Title -->
    <h3 class="tc-title">{{ currentStep().title }}</h3>

    <!-- Description -->
    <p class="tc-desc">{{ currentStep().description }}</p>

    <!-- Auto-play progress bar + play/pause -->
    <div class="tc-prog-row">
      <div class="tc-prog-track">
        <div
          class="tour-prog-fill"
          [style.width.%]="progW"
          [style.transition]="progTrans">
        </div>
      </div>
      <button
        class="tc-play-btn"
        (click)="isPaused ? resumePlay() : pausePlay()"
        [title]="isPaused ? 'Resume auto-advance' : 'Pause auto-advance'"
        [attr.aria-label]="isPaused ? 'Resume' : 'Pause'">
        <i class="pi" [ngClass]="isPaused ? 'pi-play' : 'pi-pause'"></i>
      </button>
    </div>

    <!-- Dot indicators -->
    <div class="tc-dots" role="tablist" aria-label="Tour steps">
      @for (step of steps; track $index; let i = $index) {
        <button
          class="tc-dot"
          [class.active]="i === stepIndex()"
          [class.visited]="i < stepIndex()"
          (click)="goTo(i)"
          [attr.title]="step.title"
          [attr.aria-label]="'Go to step ' + (i + 1) + ': ' + step.title"
          role="tab"
          [attr.aria-selected]="i === stepIndex()">
        </button>
      }
    </div>

    <!-- Navigation row -->
    <div class="tc-nav">
      <button class="tc-btn-skip" (click)="skip()">
        Skip tour
      </button>

      <div class="tc-nav-btns">
        <button
          class="tc-btn-back"
          (click)="back()"
          [disabled]="isFirst()"
          title="Previous step (← Left Arrow)"
          aria-label="Previous step">
          <i class="pi pi-arrow-left"></i>
          <span>Back</span>
        </button>

        <button
          class="tc-btn-next"
          (click)="next()"
          [title]="isLast() ? 'Finish tour' : 'Next step (→ Right Arrow)'"
          [attr.aria-label]="isLast() ? 'Finish' : 'Next step'">
          <span>{{ isLast() ? 'Finish' : 'Next' }}</span>
          <i class="pi" [ngClass]="isLast() ? 'pi-check' : 'pi-arrow-right'"></i>
        </button>
      </div>
    </div>

    <!-- Keyboard hint -->
    <div class="tc-keyboard-hint">
      <span><kbd>←</kbd> Back</span>
      <span><kbd>→</kbd> Next</span>
      <span><kbd>Esc</kbd> Skip</span>
    </div>

  </div>

}
